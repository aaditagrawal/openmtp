name: Native macOS release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'aaditagrawal/openmtp'
    name: Native release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OPENMTP_ARCH: ${{ matrix.arch }}
      OPENMTP_BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
      OPENMTP_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      HAS_UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && vars.SPARKLE_PUBLIC_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version and signing mode
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat macos/VERSION)"
          test "$(uname -m)" = "$OPENMTP_ARCH"
          if [[ "$GITHUB_REF_NAME" != *-* && ( "$HAS_SIGNING" != true || "$HAS_UPDATE_KEY" != true ) ]]; then
            echo 'Stable releases require Developer ID signing, notarization and Sparkle update keys.' >&2
            exit 1
          fi
          if [[ "$HAS_SIGNING" == true && "$HAS_UPDATE_KEY" != true ]]; then
            echo 'Signed releases require matching Sparkle update keys.' >&2
            exit 1
          fi
          make verify
      - name: Test native release
        run: make format-check test
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: ./macos/scripts/import-signing.sh
      - name: Package signed and notarized release
        if: env.HAS_SIGNING == 'true'
        env:
          OPENMTP_NOTARIZE: '1'
          APPLEID: ${{ secrets.APPLEID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make package
      - name: Package ad-hoc prerelease
        if: env.HAS_SIGNING != 'true'
        run: make package
      - name: Verify native artifacts
        run: ./macos/scripts/verify-package.sh
      - name: Generate and verify signed native update feed
        if: env.HAS_SIGNING == 'true'
        env:
          OPENMTP_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./macos/scripts/generate-appcast.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenMTP-native-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${OPENMTP_SIGN_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OPENMTP_SIGN_KEYCHAIN"
          fi

  publish:
    name: Publish native release
    needs: package
    runs-on: macos-26
    concurrency:
      group: native-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: OpenMTP-native-*
          merge-multiple: true
          path: dist
      - name: Create release with native asset labels
        run: ./macos/scripts/publish-release.sh "$GITHUB_REF_NAME"
