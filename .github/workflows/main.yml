name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Attempt to build OpenMTP
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Attempt to generate unsigned macOS app
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bun run package-mac-without-notarize-no-verify 2>&1 || true
      - name: Check if macOS app was generated
        run: test -e dist/mac/OpenMTP.app
      - name: Create disk image
        run: |
          mkdir dist/dmg
          bunx create-dmg dist/mac/OpenMTP.app dist/dmg 2>&1 || true
          shasum dist/dmg/* >> dist/dmg/CHECKSUM_SHA256.txt
      - name: Upload disk image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Disk Image
          path: dist/dmg/
