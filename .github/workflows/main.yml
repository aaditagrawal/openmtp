name: Native macOS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Swift (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OPENMTP_ARCH: ${{ matrix.arch }}
      OPENMTP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native toolchain
        run: |
          test "$(uname -m)" = "$OPENMTP_ARCH"
          make verify
      - name: Swift formatting
        run: make format-check
      - name: Protocol, transfer, UI-model and parity tests
        run: make test
      - name: Build and package the native app
        run: make package
      - name: Verify package contents
        run: ./macos/scripts/verify-package.sh
      - name: Upload native preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenMTP-native-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
