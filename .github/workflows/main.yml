name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      # Skip postinstall (webpack DLL + electron-builder native deps) — oxlint/oxfmt
      # only need the JS toolchain from the lockfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run oxlint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check

  build:
    name: Build
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install global tools
        run: npm install -g cross-env
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Webpack production build without packaging. Lint runs in the parallel job.
      - name: Build main + renderer
        run: bun run build-no-verify

  package:
    name: Package macOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, build]
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install global tools
        run: npm install -g cross-env create-dmg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate unsigned macOS app
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bun run package-mac-without-notarize-no-verify 2>&1 || true
      - name: Check if macOS app was generated
        run: test -e dist/mac/OpenMTP.app
      - name: Create disk image
        run: |
          mkdir -p dist/dmg
          create-dmg dist/mac/OpenMTP.app dist/dmg 2>&1 || true
          shasum dist/dmg/* >> dist/dmg/CHECKSUM_SHA256.txt
      - name: Upload disk image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Disk Image
          path: dist/dmg/
