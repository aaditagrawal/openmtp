name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Cloning Git repository
        uses: actions/checkout@v4
      - name: Setup build environment
        uses: actions/setup-node@v4
        with:
          node-version: '25.8.1'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Attempt to build OpenMTP
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Attempt to generate unsigned macOS app
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bun run package-mac-without-notarize 2>&1 || true
      - name: Check if macOS app was generated
        run: test -e dist/mac/OpenMTP.app
      - name: Attempt to create disk image for generated macOS app
        run: |
          mkdir dist/dmg
          bunx create-dmg dist/mac/OpenMTP.app dist/dmg 2>&1 || true
          shasum dist/dmg/* >> dist/dmg/CHECKSUM_SHA256.txt
      - name: Upload disk image and checksum as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'Disk Image'
          path: dist/dmg/
