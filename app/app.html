<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no"
    />
    <title>OpenMTP | Android File Transfer for macOS</title>
    <script>
      (() => {
        const diagnosticsEnabled =
          typeof process === 'object' &&
          typeof process.env === 'object' &&
          process.env.OPENMTP_RENDERER_DIAGNOSTICS === '1';

        if (diagnosticsEnabled) {
          window.addEventListener('error', (event) => {
            console.error(
              `[renderer-window-error] ${event.message} @ ${event.filename}:${event.lineno}:${event.colno}`,
            );
          });

          window.addEventListener('unhandledrejection', (event) => {
            const reason =
              event.reason && event.reason.stack
                ? event.reason.stack
                : String(event.reason);

            console.error(`[renderer-unhandledrejection] ${reason}`);
          });
        }

        if (
          typeof process === 'object' &&
          typeof process.env === 'object' &&
          typeof process.env.NODE_ENV === 'undefined'
        ) {
          process.env.NODE_ENV = 'production';
        }

        if (
          typeof process !== 'object' ||
          (typeof process === 'object' && !process.env.START_HOT)
        ) {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './dist/style.css';
          // HACK: Writing the script path should be done with webpack
          document.getElementsByTagName('head')[0].appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (typeof process === 'object') {
        const scripts = [];

        // Packaged / production: always ./dist/renderer.prod.js (no START_HOT).
        // Dev + START_HOT: load webpack writeToDisk output next to app.html
        // (./renderer.dev.js). Do not use http://localhost here — Electron
        // blocks file:// documents from loading cross-scheme http scripts.
        if (process.env.START_HOT && process.env.NODE_ENV === 'development') {
          scripts.push('./renderer.dev.js');
        } else {
          scripts.push('./dist/renderer.prod.js');
        }

        if (scripts.length) {
          const diagnosticsEnabled =
            typeof process === 'object' &&
            typeof process.env === 'object' &&
            process.env.OPENMTP_RENDERER_DIAGNOSTICS === '1';

          if (diagnosticsEnabled) {
            window.__OPENMTP_SCRIPTS__ = [...scripts];
          }

          document.write(
            scripts
              .map(
                (script) =>
                  `<script defer src="${script}"${
                    diagnosticsEnabled
                      ? ` onload="console.info('[renderer-script-load] ${script}')"` +
                        ` onerror="console.error('[renderer-script-error] ${script}')"`
                      : ''
                  }><\/script>`,
              )
              .join(''),
          );
        }
      }
    </script>
  </body>
</html>
